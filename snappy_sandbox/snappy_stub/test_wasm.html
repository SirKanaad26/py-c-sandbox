<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snappy WASM Test</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            line-height: 1.6;
        }
        .container {
            background-color: #2d2d30;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .result {
            background-color: #0e639c;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error {
            background-color: #d73a49;
            color: white;
        }
        .success {
            background-color: #28a745;
            color: white;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #106ebe;
        }
        input[type="number"] {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #5a5a5a;
            padding: 8px;
            border-radius: 4px;
            width: 100px;
        }
        h1, h2 {
            color: #569cd6;
        }
    </style>
</head>
<body>
    <h1>Snappy WebAssembly Test</h1>
    
    <div class="container">
        <h2>Module Status</h2>
        <div id="status">Loading WASM module...</div>
    </div>

    <div class="container">
        <h2>Test Functions</h2>
        
        <div>
            <h3>Basic Test Function</h3>
            <input type="number" id="testInput" value="42" placeholder="Enter number">
            <button onclick="runBasicTest()">Test Double Function</button>
            <div id="basicResult" class="result"></div>
        </div>

        <div>
            <h3>Max Compressed Length Calculator</h3>
            <input type="number" id="lengthInput" value="1000" placeholder="Input size">
            <button onclick="calculateMaxLength()">Calculate Max Compressed Size</button>
            <div id="lengthResult" class="result"></div>
        </div>

        <div>
            <h3>Uncompressed Length Test</h3>
            <input type="number" id="testSizeInput" value="12345" placeholder="Test size">
            <button onclick="testUncompressedLength()">Test Uncompressed Length</button>
            <div id="uncompressedResult" class="result"></div>
        </div>

        <div>
            <h3>Batch Test</h3>
            <button onclick="runBatchTest()">Run Multiple Size Tests</button>
            <div id="batchResult" class="result"></div>
        </div>
    </div>

    <div class="container">
        <h2>Performance Test</h2>
        <button onclick="runPerformanceTest()">Run Performance Test</button>
        <div id="perfResult" class="result"></div>
    </div>

    <script>
        let snappyModule = null;
        let maxCompressedLength = null;
        let testFunction = null;
        let getVersion = null;

        // Load the WASM module
        async function loadModule() {
            try {
                // Use script tag approach for better browser compatibility
                const script = document.createElement('script');
                script.src = './wasm_build/snappy_wasm.js';
                
                const loadPromise = new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = reject;
                });
                
                document.head.appendChild(script);
                await loadPromise;
                
                // Now SnappyModule should be available globally
                if (typeof SnappyModule === 'undefined') {
                    throw new Error('SnappyModule not defined after loading script');
                }
                
                snappyModule = await SnappyModule();
                
                // Get function references
                maxCompressedLength = snappyModule.cwrap('wasm_max_compressed_length', 'number', ['number']);
                testFunction = snappyModule.cwrap('wasm_test_function', 'number', ['number']);
                getVersion = snappyModule.cwrap('wasm_get_version', 'number', []);
                
                // New functions
                window.uncompressedLength = snappyModule.cwrap('wasm_uncompressed_length', 'number', ['number', 'number', 'number']);
                window.validateCompressed = snappyModule.cwrap('wasm_validate_compressed_buffer', 'number', ['number', 'number']);
                window.createMockCompressed = snappyModule.cwrap('wasm_create_mock_compressed', 'number', ['number', 'number', 'number']);
                window.snappyModule = snappyModule; // Make available globally
                
                document.getElementById('status').innerHTML = 
                    '<div class="success"> WASM module loaded successfully!<br>' +
                    'Version: ' + getVersion() + '</div>';
                
            } catch (error) {
                console.error('Detailed error:', error);
                document.getElementById('status').innerHTML = 
                    '<div class="error"> Failed to load WASM module:<br>' + error.message + '<br><br>' +
                    'Troubleshooting:<br>' +
                    '1. Make sure you\'re running from a web server<br>' +
                    '2. Check that wasm_build/snappy_wasm.js exists<br>' +
                    '3. Check browser console for details</div>';
            }
        }

        function runBasicTest() {
            if (!testFunction) {
                document.getElementById('basicResult').innerHTML = 
                    '<div class="error">WASM module not loaded</div>';
                return;
            }

            const input = parseInt(document.getElementById('testInput').value);
            const result = testFunction(input);
            
            document.getElementById('basicResult').innerHTML = 
                `Input: ${input}\nOutput: ${result}\n${result === input * 2 ? 'Test passed!' : 'Test failed!'}`;
        }

        function calculateMaxLength() {
            if (!maxCompressedLength) {
                document.getElementById('lengthResult').innerHTML = 
                    '<div class="error">WASM module not loaded</div>';
                return;
            }

            const inputSize = parseInt(document.getElementById('lengthInput').value);
            const maxSize = maxCompressedLength(inputSize);
            const overhead = maxSize - inputSize;
            const overheadPercent = inputSize > 0 ? (overhead / inputSize * 100).toFixed(1) : 0;
            
            document.getElementById('lengthResult').innerHTML = 
                `Input size: ${inputSize.toLocaleString()} bytes\n` +
                `Max compressed: ${maxSize.toLocaleString()} bytes\n` +
                `Overhead: ${overhead.toLocaleString()} bytes (${overheadPercent}%)\n` +
                `Compression ratio: ${inputSize > 0 ? (inputSize / maxSize).toFixed(2) : 'N/A'}:1`;
        }

        function testUncompressedLength() {
            if (!window.snappyModule) {
                document.getElementById('uncompressedResult').innerHTML = 
                    '<div class="error">WASM module not loaded</div>';
                return;
            }

            const testSize = parseInt(document.getElementById('testSizeInput').value);
            const mockBufferSize = 64;
            
            // Allocate memory in WASM
            const mockBuffer = window.snappyModule._malloc(mockBufferSize);
            const resultPtr = window.snappyModule._malloc(4);
            
            try {
                // Create mock compressed data
                const compressedSize = window.createMockCompressed(testSize, mockBuffer, mockBufferSize);
                
                // Test uncompressed length
                const status = window.uncompressedLength(mockBuffer, compressedSize, resultPtr);
                const retrievedSize = window.snappyModule.getValue(resultPtr, 'i32');
                
                // Test validation
                const validationStatus = window.validateCompressed(mockBuffer, compressedSize);
                
                document.getElementById('uncompressedResult').innerHTML = 
                    `Mock compressed data: ${compressedSize} bytes\n` +
                    `Uncompressed length status: ${status} (0=OK)\n` +
                    `Original size: ${testSize}\n` +
                    `Retrieved size: ${retrievedSize}\n` +
                    `Size match: ${testSize === retrievedSize ? 'PASS' : 'FAIL'}\n` +
                    `Validation status: ${validationStatus} (0=OK)\n` +
                    `Validation: ${validationStatus === 0 ? 'PASS' : 'FAIL'}`;
                
            } finally {
                // Clean up
                window.snappyModule._free(mockBuffer);
                window.snappyModule._free(resultPtr);
            }
        }

        function runBatchTest() {
            if (!maxCompressedLength) {
                document.getElementById('batchResult').innerHTML = 
                    '<div class="error">WASM module not loaded</div>';
                return;
            }

            const testSizes = [0, 10, 100, 1000, 10000, 100000, 1000000];
            let results = "Batch Test Results:\n" + "=".repeat(50) + "\n";
            
            testSizes.forEach(size => {
                const maxSize = maxCompressedLength(size);
                const overhead = maxSize - size;
                const overheadPercent = size > 0 ? (overhead / size * 100).toFixed(1) : 0;
                
                results += `${size.toString().padStart(8)} bytes → ` +
                          `${maxSize.toString().padStart(8)} bytes ` +
                          `(+${overheadPercent}%)\n`;
            });
            
            document.getElementById('batchResult').innerHTML = results;
        }

        function runPerformanceTest() {
            if (!maxCompressedLength) {
                document.getElementById('perfResult').innerHTML = 
                    '<div class="error">WASM module not loaded</div>';
                return;
            }

            const iterations = 100000;
            const testSize = 1000;
            
            const startTime = performance.now();
            
            for (let i = 0; i < iterations; i++) {
                maxCompressedLength(testSize);
            }
            
            const endTime = performance.now();
            const totalTime = endTime - startTime;
            const avgTime = totalTime / iterations;
            const callsPerSecond = (iterations / (totalTime / 1000)).toFixed(0);
            
            document.getElementById('perfResult').innerHTML = 
                `Performance Test Results:\n` +
                `Iterations: ${iterations.toLocaleString()}\n` +
                `Total time: ${totalTime.toFixed(2)} ms\n` +
                `Average per call: ${(avgTime * 1000).toFixed(3)} μs\n` +
                `Calls per second: ${Number(callsPerSecond).toLocaleString()}`;
        }

        // Load module when page loads
        loadModule();
    </script>
</body>
</html>
