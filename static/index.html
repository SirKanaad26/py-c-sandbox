<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snappy Compression Tool</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Snappy Compression Tool</h1>
      <p>High-performance compression and decompression utility</p>
    </div>

    <div class="mode-toggle">
      <div class="toggle-switch sandboxed" onclick="toggleMode()">
        <span>Sandboxed</span>
        <span>Unsandboxed</span>
        <div class="toggle-slider"></div>
      </div>
    </div>

    <div class="main-content">
      <div class="input-section">
        <div class="section-title">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
          </svg>
          Input Data
        </div>
        
        <textarea id="textInput" placeholder="Enter text to compress or drag and drop a file..."></textarea>
        


        <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" style="display: none;" onchange="handleFile(this.files[0])">
          📁 Drop a file here or click to select
        </div>

        <div class="button-group">
          <button class="btn-primary" onclick="compress()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
            Compress
          </button>
          <button class="btn-secondary" onclick="clearInput()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" />
            </svg>
            Clear
          </button>
        </div>
      </div>

      <div class="output-section">
        <div class="section-title">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z" />
          </svg>
          Output & Statistics
        </div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Processing...</p>
        </div>

        <div id="results" style="display: none;">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">Original Size</div>
              <div class="stat-value" id="originalSize">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Compressed Size</div>
              <div class="stat-value" id="compressedSize">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Compression Ratio</div>
              <div class="stat-value compression-ratio" id="compressionRatio">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Space Saved</div>
              <div class="stat-value" id="spaceSaved">-</div>
            </div>
          </div>

          <div class="button-group">
            <button class="btn-success" onclick="downloadCompressed()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" />
              </svg>
              Download Compressed
            </button>
            <button class="btn-secondary" onclick="copyToClipboard()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
              </svg>
              Copy Result
            </button>
          </div>
        </div>

        <div id="alerts"></div>
      </div>
    </div>
  </div>

  <script src="static/script.js"></script>
</body>
</html>
